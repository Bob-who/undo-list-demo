<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项管理工具 v1.02</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- 内嵌CSS -->
    <style>
/* 待办事项管理工具样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    min-height: 100vh;
}

.container {
    width: 100%;            
    max-width: 700px;
    background-color: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    padding: 32px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.input-container {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

#task-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.3s;
}

#task-input:focus {
    border-color: #4a90e2;
}

button {
    background-color: #4a90e2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
    /* 添加触摸延迟，降低敏感度 */
    touch-action: manipulation;
}

button:hover {
    background-color: #3a7bc8;
}

.task-list {
    list-style-type: none;
}

.task-item {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #eee;
    animation: fadeIn 0.3s ease;
}

.task-item:last-child {
    border-bottom: none;
}

.task-checkbox {
    margin-right: 16px;
    width: 20px;
    height: 20px;
    cursor: pointer;
    /* 增加触摸区域 */
    min-width: 24px;
    min-height: 24px;
}

.task-text {
    flex: 1;
    font-size: 16px;
    color: #333;
    transition: color 0.3s, text-decoration 0.3s;
}

.completed .task-text {
    color: #888;
    text-decoration: line-through;
}

.delete-btn {
    background-color: transparent;
    color: #ff6b6b;
    padding: 8px;
    margin-left: 8px;
    font-size: 14px;
    opacity: 0.7;
}

.delete-btn:hover {
    background-color: transparent;
    opacity: 1;
}

.task-actions {
    display: flex;
    align-items: center;
    /* 增加按钮间距，防止误触 */
    gap: 10px;
}

.edit-btn {
    background-color: transparent;
    color: #4a90e2;
    padding: 8px;
    margin-left: 8px;
    font-size: 14px;
    opacity: 0.7;
}

.edit-btn:hover {
    background-color: transparent;
    opacity: 1;
}

.filter-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    /* 增加过滤按钮间距 */
    gap: 15px;
}

.filter-btn {
    background-color: transparent;
    color: #666;
    border: 1px solid #ddd;
    padding: 8px 16px;
    font-size: 14px;
}

.filter-btn.active {
    background-color: #4a90e2;
    color: white;
    border-color: #4a90e2;
}

.empty-state {
    text-align: center;
    padding: 40px 0;
    color: #888;
}

.empty-state p {
    margin-bottom: 20px;
}

/* 新增：任务分类样式 */
.category-tag {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-left: 10px;
    color: white;
}

.category-work {
    background-color: #4a90e2;
}

.category-personal {
    background-color: #50b83c;
}

.category-shopping {
    background-color: #f49342;
}

.category-other {
    background-color: #9c6ade;
}

/* 新增：任务完成动画 */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes taskComplete {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.task-complete-animation {
    animation: taskComplete 0.3s ease;
}

/* 响应式设计 */
@media (max-width: 600px) {
    .container {
        padding: 20px;
    }
    
    .input-container {
        flex-direction: column;
    }
    
    #task-input, button {
        width: 100%;
    }
    
    /* 手机端按钮样式优化 */
    button {
        /* 增加按钮高度，提供更大的触摸区域 */
        min-height: 48px;
        /* 添加触摸延迟，降低敏感度 */
        touch-action: manipulation;
    }
    
    .task-actions {
        /* 增加按钮间距，防止误触 */
        gap: 16px;
    }
    
    .edit-btn, .delete-btn {
        /* 增加按钮触摸区域 */
        padding: 10px 12px;
        /* 移除左边距，使用gap控制间距 */
        margin-left: 0;
    }
    
    /* 增加复选框大小，便于触摸 */
    .task-checkbox {
        width: 24px;
        height: 24px;
        min-width: 30px;
        min-height: 30px;
    }
    
    /* 增加过滤按钮的触摸区域 */
    .filter-btn {
        padding: 10px 16px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>待办事项管理工具</h1>
        
        <!-- 过滤器 -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">待完成</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-container">
            <input type="text" id="task-input" placeholder="添加新任务...">
            
            <!-- 新增：任务分类选择 -->
            <select id="category-select">
                <option value="work">工作</option>
                <option value="personal">个人</option>
                <option value="shopping">购物</option>
                <option value="other">其他</option>
            </select>
            
            <button id="add-button">添加</button>
        </div>
        
        <!-- 任务列表 -->
        <ul id="task-list"></ul>
    </div>
    
    <!-- 内嵌JavaScript -->
    <script>
// Firebase 配置
const firebaseConfig = {
    apiKey: "AIzaSyDQoFW6eYP0Xq6Tv2Mf6Z3qYbCjFoVRSGY",
    authDomain: "todo-list-demo-e5f9c.firebaseapp.com",
    databaseURL: "https://todo-list-demo-e5f9c-default-rtdb.firebaseio.com",
    projectId: "todo-list-demo-e5f9c",
    storageBucket: "todo-list-demo-e5f9c.appspot.com",
    messagingSenderId: "1045286535483",
    appId: "1:1045286535483:web:c9e5c8b7a2a8a5c1f7a3e9"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const tasksRef = database.ref('tasks');

// DOM 元素
const taskInput = document.getElementById('task-input');
const addButton = document.getElementById('add-button');
const taskList = document.getElementById('task-list');
const filterButtons = document.querySelectorAll('.filter-btn');
const categorySelect = document.getElementById('category-select');

// 当前过滤状态
let currentFilter = 'all';

// 本地存储键
const LOCAL_STORAGE_KEY = 'todoApp.tasks';

// 触摸事件变量，用于降低敏感度
let touchStartTime = 0;
const TOUCH_DELAY = 150; // 触摸延迟时间（毫秒）

// 初始化应用
document.addEventListener('DOMContentLoaded', () => {
    // 从Firebase加载任务
    loadTasksFromFirebase();
    
    // 如果Firebase不可用，从本地存储加载
    window.addEventListener('offline', () => {
        console.log('网络连接断开，切换到本地存储模式');
        loadTasksFromLocalStorage();
    });
    
    // 恢复在线时，同步到Firebase
    window.addEventListener('online', () => {
        console.log('网络连接恢复，同步到Firebase');
        const tasks = getTasksFromLocalStorage();
        syncTasksToFirebase(tasks);
    });
    
    // 添加任务事件监听
    addButton.addEventListener('click', addTask);
    
    // 添加触摸事件处理，降低敏感度
    addButton.addEventListener('touchstart', handleTouchStart);
    addButton.addEventListener('touchend', (e) => {
        handleTouchEnd(e, addTask);
    });
    
    taskInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            addTask();
        }
    });
    
    // 过滤按钮事件监听
    filterButtons.forEach(button => {
        button.addEventListener('click', () => {
            const filter = button.dataset.filter;
            setFilter(filter);
            
            // 更新活跃按钮样式
            filterButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        });
        
        // 添加触摸事件处理，降低敏感度
        button.addEventListener('touchstart', handleTouchStart);
        button.addEventListener('touchend', (e) => {
            handleTouchEnd(e, () => {
                const filter = button.dataset.filter;
                setFilter(filter);
                
                // 更新活跃按钮样式
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });
    });
});

// 触摸开始处理函数
function handleTouchStart() {
    touchStartTime = Date.now();
}

// 触摸结束处理函数
function handleTouchEnd(event, callback) {
    // 防止默认行为和事件冒泡
    event.preventDefault();
    
    // 计算触摸持续时间
    const touchDuration = Date.now() - touchStartTime;
    
    // 如果触摸时间太短，可能是误触，不执行操作
    if (touchDuration < TOUCH_DELAY) {
        return;
    }
    
    // 执行回调函数
    callback();
}

// 从Firebase加载任务
function loadTasksFromFirebase() {
    tasksRef.on('value', (snapshot) => {
        const tasksData = snapshot.val() || {};
        renderTasks(tasksData);
        
        // 同时保存到本地存储作为备份
        saveTasksToLocalStorage(tasksData);
    });
}

// 从本地存储加载任务
function loadTasksFromLocalStorage() {
    const tasks = getTasksFromLocalStorage();
    renderTasks(tasks);
}

// 获取本地存储中的任务
function getTasksFromLocalStorage() {
    const tasksJSON = localStorage.getItem(LOCAL_STORAGE_KEY);
    return tasksJSON ? JSON.parse(tasksJSON) : {};
}

// 保存任务到本地存储
function saveTasksToLocalStorage(tasks) {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(tasks));
}

// 同步任务到Firebase
function syncTasksToFirebase(tasks) {
    tasksRef.set(tasks);
}

// 添加任务
function addTask() {
    const text = taskInput.value.trim();
    const category = categorySelect.value;
    
    if (text) {
        // 创建新任务对象
        const newTask = {
            id: Date.now().toString(),
            text: text,
            completed: false,
            category: category,
            createdAt: Date.now()
        };
        
        // 添加到Firebase
        tasksRef.child(newTask.id).set(newTask)
            .then(() => {
                console.log('任务添加成功');
                
                // 清空输入框
                taskInput.value = '';
                taskInput.focus();
            })
            .catch(error => {
                console.error('添加任务失败:', error);
                
                // 如果Firebase添加失败，保存到本地
                const tasks = getTasksFromLocalStorage();
                tasks[newTask.id] = newTask;
                saveTasksToLocalStorage(tasks);
                renderTasks(tasks);
                
                // 清空输入框
                taskInput.value = '';
                taskInput.focus();
            });
    }
}

// 删除任务
function deleteTask(taskId) {
    // 从Firebase删除
    tasksRef.child(taskId).remove()
        .catch(error => {
            console.error('删除任务失败:', error);
            
            // 如果Firebase删除失败，从本地删除
            const tasks = getTasksFromLocalStorage();
            delete tasks[taskId];
            saveTasksToLocalStorage(tasks);
            renderTasks(tasks);
        });
}

// 切换任务完成状态
function toggleTaskComplete(taskId, currentStatus) {
    // 获取任务元素
    const taskElement = document.querySelector(`.task-item[data-id="${taskId}"]`);
    
    // 添加动画
    taskElement.classList.add('task-complete-animation');
    
    // 动画结束后移除类
    setTimeout(() => {
        taskElement.classList.remove('task-complete-animation');
    }, 300);
    
    // 更新Firebase中的状态
    tasksRef.child(taskId).update({
        completed: !currentStatus
    }).catch(error => {
        console.error('更新任务状态失败:', error);
        
        // 如果Firebase更新失败，更新本地存储
        const tasks = getTasksFromLocalStorage();
        if (tasks[taskId]) {
            tasks[taskId].completed = !currentStatus;
            saveTasksToLocalStorage(tasks);
            renderTasks(tasks);
        }
    });
}

// 编辑任务
function editTask(taskId, currentText) {
    const newText = prompt('编辑任务', currentText);
    
    if (newText !== null && newText.trim() !== '') {
        // 更新Firebase中的文本
        tasksRef.child(taskId).update({
            text: newText.trim()
        }).catch(error => {
            console.error('编辑任务失败:', error);
            
            // 如果Firebase更新失败，更新本地存储
            const tasks = getTasksFromLocalStorage();
            if (tasks[taskId]) {
                tasks[taskId].text = newText.trim();
                saveTasksToLocalStorage(tasks);
                renderTasks(tasks);
            }
        });
    }
}

// 设置过滤器
function setFilter(filter) {
    currentFilter = filter;
    renderTasks(getTasksFromLocalStorage());
}

// 渲染任务列表
function renderTasks(tasksData) {
    // 清空任务列表
    taskList.innerHTML = '';
    
    // 将对象转换为数组并排序（最新的任务在前面）
    const tasksArray = Object.values(tasksData).sort((a, b) => b.createdAt - a.createdAt);
    
    // 根据过滤器筛选任务
    const filteredTasks = tasksArray.filter(task => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
    });
    
    // 如果没有任务，显示空状态
    if (filteredTasks.length === 0) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        
        const message = currentFilter === 'all' 
            ? '没有任务，添加一个吧！' 
            : currentFilter === 'active' 
                ? '没有待完成的任务' 
                : '没有已完成的任务';
        
        emptyState.innerHTML = `
            <p>${message}</p>
            ${currentFilter === 'all' ? '<button id="add-sample-tasks">添加示例任务</button>' : ''}
        `;
        
        taskList.appendChild(emptyState);
        
        // 添加示例任务按钮事件
        const addSampleButton = document.getElementById('add-sample-tasks');
        if (addSampleButton) {
            addSampleButton.addEventListener('click', addSampleTasks);
            
            // 添加触摸事件处理
            addSampleButton.addEventListener('touchstart', handleTouchStart);
            addSampleButton.addEventListener('touchend', (e) => {
                handleTouchEnd(e, addSampleTasks);
            });
        }
        
        return;
    }
    
    // 渲染任务列表
    filteredTasks.forEach(task => {
        const taskItem = document.createElement('li');
        taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
        taskItem.dataset.id = task.id;
        
        // 获取分类样式
        const categoryClass = `category-${task.category || 'other'}`;
        const categoryText = getCategoryText(task.category);
        
        taskItem.innerHTML = `
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
            <span class="task-text">${task.text}</span>
            <span class="category-tag ${categoryClass}">${categoryText}</span>
            <div class="task-actions">
                <button class="edit-btn">编辑</button>
                <button class="delete-btn">删除</button>
            </div>
        `;
        
        // 添加事件监听
        const checkbox = taskItem.querySelector('.task-checkbox');
        const editBtn = taskItem.querySelector('.edit-btn');
        const deleteBtn = taskItem.querySelector('.delete-btn');
        
        checkbox.addEventListener('change', () => {
            toggleTaskComplete(task.id, task.completed);
        });
        
        // 添加触摸事件处理
        checkbox.addEventListener('touchstart', handleTouchStart);
        checkbox.addEventListener('touchend', (e) => {
            handleTouchEnd(e, () => {
                toggleTaskComplete(task.id, task.completed);
            });
        });
        
        editBtn.addEventListener('click', () => {
            editTask(task.id, task.text);
        });
        
        // 添加触摸事件处理
        editBtn.addEventListener('touchstart', handleTouchStart);
        editBtn.addEventListener('touchend', (e) => {
            handleTouchEnd(e, () => {
                editTask(task.id, task.text);
            });
        });
        
        deleteBtn.addEventListener('click', () => {
            if (confirm('确定要删除这个任务吗？')) {
                deleteTask(task.id);
            }
        });
        
        // 添加触摸事件处理
        deleteBtn.addEventListener('touchstart', handleTouchStart);
        deleteBtn.addEventListener('touchend', (e) => {
            handleTouchEnd(e, () => {
                if (confirm('确定要删除这个任务吗？')) {
                    deleteTask(task.id);
                }
            });
        });
        
        taskList.appendChild(taskItem);
    });
}

// 获取分类文本
function getCategoryText(category) {
    switch(category) {
        case 'work': return '工作';
        case 'personal': return '个人';
        case 'shopping': return '购物';
        case 'other': return '其他';
        default: return '其他';
    }
}

// 添加示例任务
function addSampleTasks() {
    const sampleTasks = [
        {
            id: Date.now().toString(),
            text: '完成工作报告',
            completed: false,
            category: 'work',
            createdAt: Date.now()
        },
        {
            id: (Date.now() + 1).toString(),
            text: '购买生日礼物',
            completed: false,
            category: 'shopping',
            createdAt: Date.now() - 1000
        },
        {
            id: (Date.now() + 2).toString(),
            text: '健身锻炼',
            completed: false,
            category: 'personal',
            createdAt: Date.now() - 2000
        }
    ];
    
    // 批量添加到Firebase
    const updates = {};
    sampleTasks.forEach(task => {
        updates[task.id] = task;
    });
    
    tasksRef.update(updates)
        .catch(error => {
            console.error('添加示例任务失败:', error);
            
            // 如果Firebase添加失败，保存到本地
            const tasks = getTasksFromLocalStorage();
            sampleTasks.forEach(task => {
                tasks[task.id] = task;
            });
            saveTasksToLocalStorage(tasks);
            renderTasks(tasks);
        });
}
    </script>
</body>
</html>
