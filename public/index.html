                // 修改排序函数以支持历史任务
                function sortTasks(sortType, isHistory = false) {
                    console.log('开始排序，类型:', sortType, '是否历史任务:', isHistory);
                    // 获取要排序的任务数组
                    let tasksToSort = isHistory ? 
                        tasks.filter(task => task.completed) :
                        tasks.filter(task => !task.completed);
                    
                    console.log('排序前的任务:', tasksToSort);
                    
                    switch(sortType) {
                        case 'priority':
                            // 重新实现优先级排序
                            tasksToSort.sort((a, b) => {
                                // 定义优先级顺序
                                const order = ['urgent', 'high', 'medium', 'low'];
                                
                                // 获取优先级索引
                                const indexA = order.indexOf(a.priority);
                                const indexB = order.indexOf(b.priority);
                                
                                // 确保未定义的优先级排在最后
                                const valueA = indexA === -1 ? order.length : indexA;
                                const valueB = indexB === -1 ? order.length : indexB;
                                
                                // 比较优先级
                                return valueA - valueB;
                            });
                            break;
                        case 'name':
                            tasksToSort.sort((a, b) => a.text.localeCompare(b.text));
                            break;
                        case 'date':
                            tasksToSort.sort((a, b) => {
                                if (!a.dueDate) return 1;
                                if (!b.dueDate) return -1;
                                return new Date(a.dueDate) - new Date(b.dueDate);
                            });
                            break;
                        case 'created':
                            tasksToSort.sort((a, b) => {
                                // 确保有创建时间的任务
                                const timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                                const timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                                // 按创建时间降序排序（新创建的在前）
                                return timeB - timeA;
                            });
                            break;
                        case 'completed':
                            tasksToSort.sort((a, b) => {
                                // 确保有完成时间的任务
                                const timeA = a.completedAt ? new Date(a.completedAt).getTime() : 0;
                                const timeB = b.completedAt ? new Date(b.completedAt).getTime() : 0;
                                // 按完成时间降序排序（最近完成的在前）
                                return timeB - timeA;
                            });
                            break;
                    }
                    
                    // 更新原始数组中的顺序
                    const otherTasks = isHistory ? 
                        tasks.filter(task => !task.completed) :
                        tasks.filter(task => task.completed);
                      
                    tasks.length = 0; // 清空原数组
                    if (isHistory) {
                        tasks.push(...otherTasks, ...tasksToSort);
                    } else {
                        tasks.push(...tasksToSort, ...otherTasks);
                    }
                    
                    // 保存并重新渲染
                    saveTasks().then(() => {
                        isHistory ? renderHistoryTasks() : renderTasks();
                    });
                }

                // 修改任务完成时的处理，添加完成时间
                function markTaskAsCompleted(task) {
                    task.completed = true;
                    task.completedAt = new Date().toISOString();
                }

                // 修复拖拽排序功能
                function handleDragStart(e) {
                    e.target.classList.add('dragging');
                    // 只允许在当前任务视图中拖拽未完成的任务
                    if (currentView === 'history' || e.target.querySelector('.task-checkbox').checked) {
                        e.preventDefault();
                        return;
                    }
                    draggedItem = e.target;
                }
                
                function handleDragOver(e) {
                    e.preventDefault();
                    // 只在当前任务视图中处理拖拽
                    if (currentView === 'history') return;
                    
                    const taskList = document.getElementById('task-list');
                    const draggingItem = document.querySelector('.dragging');
                    if (!draggingItem) return;
                    
                    const siblings = [...taskList.querySelectorAll('.task-item:not(.dragging)')];
                    const nextSibling = siblings.find(sibling => {
                        const rect = sibling.getBoundingClientRect();
                        return e.clientY <= rect.top + rect.height / 2;
                    });
                    
                    if (nextSibling) {
                        taskList.insertBefore(draggingItem, nextSibling);
                    } else {
                        taskList.appendChild(draggingItem);
                    }
                }
                
                function handleDrop(e) {
                    e.preventDefault();
                    // 只在当前任务视图中处理拖拽
                    if (currentView === 'history') return;
                    
                    const taskList = document.getElementById('task-list');
                    const items = [...taskList.querySelectorAll('.task-item')];
                    const draggedIndex = tasks.findIndex(t => t === draggedItem.__task);
                    const droppedIndex = items.indexOf(draggedItem);
                    
                    if (draggedIndex !== -1 && droppedIndex !== -1 && draggedIndex !== droppedIndex) {
                        // 只重排未完成的任务
                        const uncompletedTasks = tasks.filter(task => !task.completed);
                        const completedTasks = tasks.filter(task => task.completed);
                        
                        // 获取实际的拖拽源和目标索引
                        const [movedTask] = uncompletedTasks.splice(draggedIndex, 1);
                        uncompletedTasks.splice(droppedIndex, 0, movedTask);
                        
                        // 更新主任务数组
                        tasks.length = 0;
                        tasks.push(...uncompletedTasks, ...completedTasks);
                        
                        saveTasks().then(() => {
                            renderTasks();
                        });
                    }
                }
                
                function handleDragEnd(e) {
                    e.target.classList.remove('dragging');
                    draggedItem = null;
                }

                // 在初始化时设置排序监听器
                document.getElementById('sort-select').addEventListener('change', function() {
                    sortTasks(this.value, false);
                    renderTasks();
                });
                
                document.getElementById('history-sort-select').addEventListener('change', function() {
                    sortTasks(this.value, true);
                    renderHistoryTasks();
                });

                // 添加评分功能
                function updateRating(taskId, rating) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.rating = rating;
                        saveTasks().then(() => {
                            renderHistoryTasks();
                        });
                    }
                }
                
                // 添加备注功能
                function updateRatingNote(taskId, note) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.ratingNote = note;
                        saveTasks().then(() => {
                            renderHistoryTasks();
                        });
                    }
                }
                
                // 创建评分星星
                function createRatingStars(task) {
                    const container = document.createElement('div');
                    container.className = 'rating-container';
                    
                    const starsContainer = document.createElement('div');
                    starsContainer.className = 'rating-stars';
                    
                    const ratingLabel = document.createElement('span');
                    ratingLabel.textContent = '评分：';
                    starsContainer.appendChild(ratingLabel);
                    
                    for (let i = 1; i <= 5; i++) {
                        const star = document.createElement('button');
                        star.className = 'star-button';
                        star.innerHTML = i <= (task.rating || 0) ? '★' : '☆';
                        star.addEventListener('click', () => {
                            updateRating(task.id, i);
                        });
                        starsContainer.appendChild(star);
                    }
                    
                    container.appendChild(starsContainer);
                    
                    const noteContainer = document.createElement('div');
                    noteContainer.className = 'rating-note';
                    
                    const noteTextarea = document.createElement('textarea');
                    noteTextarea.className = 'rating-note-input';
                    noteTextarea.placeholder = '添加评价备注...';
                    noteTextarea.value = task.ratingNote || '';
                    noteTextarea.addEventListener('change', (e) => {
                        updateRatingNote(task.id, e.target.value);
                    });
                    
                    noteContainer.appendChild(noteTextarea);
                    container.appendChild(noteContainer);
                    
                    return container;
                }
            });
        </script>
    </div>
</body>
</html>
